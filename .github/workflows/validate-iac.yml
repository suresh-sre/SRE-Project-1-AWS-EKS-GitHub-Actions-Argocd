name: Validate Infrastructure

on:
  push:
    branches: [ dev, qa, prod ]
    paths:
      - 'terraform/**'
      - '.github/workflows/validate-iac.yml'
  pull_request:
    branches: [ dev, qa, prod ]
    paths:
      - 'terraform/**'

env:
  AWS_REGION: us-east-1

jobs:
  terraform-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: latest

    - name: Terraform Format Check
      run: terraform fmt -check -recursive terraform/

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -backend=false

    - name: Terraform Validate
      working-directory: ./terraform
      run: terraform validate

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v3
      with:
        tflint_version: latest

    - name: Initialize TFLint
      working-directory: ./terraform
      run: tflint --init

    - name: Run TFLint
      working-directory: ./terraform
      run: tflint --format compact

  terraform-security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run TFScan (Aqua Security)
      uses: aquasecurity/tfscan-action@master
      with:
        working_directory: 'terraform/'
        sarif_file: 'tfscan.sarif'

    - name: Upload TFScan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'tfscan.sarif'
        category: 'tfscan'

  checkov-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Checkov
      id: checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform/
        framework: terraform
        quiet: false
        soft_fail: false
        skip_check: CKV_AWS_158

    - name: Upload Checkov results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'checkov.sarif'
        category: 'checkov'

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [ terraform-lint, terraform-security-scan, checkov-scan ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: latest

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -backend=false

    - name: Terraform Plan
      working-directory: ./terraform
      env:
        TF_VAR_environment: dev
      run: terraform plan -out=tfplan -json > tfplan.json

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan
        path: |
          tfplan
          tfplan.json
        retention-days: 7
