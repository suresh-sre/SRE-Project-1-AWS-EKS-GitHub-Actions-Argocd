apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-demo-app-qa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: 'https://github.com/suresh-sre/SRE-Project-1-AWS-EKS-GitHub-Actions-Argocd.git'
    targetRevision: qa
    path: helm-chart
    helm:
      valueFiles:
        - values-qa.yaml
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: qa
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
